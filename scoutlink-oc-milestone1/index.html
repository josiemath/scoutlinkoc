<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="ScoutLink OC connects Girl Scout troops, service units and volunteers across Orange County. Independent demonstration with fictional data." />
    <meta name="theme-color" content="#176B4D" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <title>ScoutLink OC</title>
    <script>(function(){try{var t=localStorage.getItem("scoutlink-theme");var d=t==="dark"||(t==="system"&&window.matchMedia("(prefers-color-scheme: dark)").matches);var r=document.documentElement;r.classList.toggle("dark",d);r.style.colorScheme=d?"dark":"light"}catch(e){}})();</script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p style="font-family: system-ui, sans-serif; padding: 2rem; max-width: 40rem">
        ScoutLink OC needs JavaScript to run. Please enable JavaScript in your browser and reload the page.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
