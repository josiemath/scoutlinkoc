<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ScoutLink OC demo</title>
  <meta name="description" content="Interactive demo of ScoutLink OC with sample troops, events and projects. Switch roles to see what each user can do.">
  <meta name="theme-color" content="#133427">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:ital,wght@0,400;0,600;0,700;1,400&display=swap">
  <link rel="stylesheet" href="base.css">
  <link rel="stylesheet" href="app.css">
</head>
<body class="app-body">
  <a class="skip-link" href="#main">Skip to content</a>

  <div class="shell">
    <aside class="sidebar" id="sidebar" aria-label="App navigation">
      <div class="sidebar-top">
        <a class="app-brand" href="index.html">
          <img src="logo.svg" alt="" width="36" height="36">
          <span>ScoutLink OC</span>
        </a>
        <button class="sidebar-close btn btn-ghost btn-sm" type="button" id="sidebar-close" aria-label="Close menu">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
      </div>
      <nav id="app-nav" class="app-nav"></nav>
      <div class="role-switch">
        <label for="role-select">Viewing the demo as</label>
        <select id="role-select"></select>
        <p id="role-who" class="role-who"></p>
      </div>
    </aside>
    <div class="scrim" id="scrim" hidden></div>

    <div class="main-col">
      <header class="topbar">
        <button class="menu-btn" type="button" id="menu-btn" aria-controls="sidebar" aria-expanded="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          <span class="visually-hidden">Open menu</span>
        </button>
        <p class="crumb" id="crumb"></p>
        <div class="topbar-right">
          <span class="who-chip" id="who-chip"></span>
        </div>
      </header>
      <p class="demo-strip">
        Demo with sample data. Changes are saved in this browser only.
        <a href="#/settings">Switch role or reset</a>
      </p>
      <main id="main" tabindex="-1"></main>
    </div>
  </div>

  <dialog id="modal" class="modal" aria-labelledby="modal-title"></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <noscript><p class="noscript">This demo needs JavaScript. The <a href="index.html">overview page</a> works without it.</p></noscript>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
