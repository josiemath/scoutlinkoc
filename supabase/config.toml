# Supabase CLI configuration for local development (`npx supabase start`).
# Hosted projects are configured in the Supabase dashboard; see docs/DEPLOYMENT.md
# for the matching settings.
project_id = "scoutlink-oc"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[auth]
enabled = true
site_url = "http://localhost:5173/"
additional_redirect_urls = ["http://localhost:5173/", "http://localhost:4173/scoutlink-oc/"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
enable_signup = true
minimum_password_length = 12

[auth.email]
enable_signup = true
enable_confirmations = true
double_confirm_changes = true
secure_password_change = true
max_frequency = "1m0s"
otp_expiry = 3600

[auth.rate_limit]
email_sent = 2
sign_in_sign_ups = 30
token_verifications = 30
